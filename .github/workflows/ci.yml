name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Unit/Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python 3.11 for asset-manager tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test asset manager offline
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m unittest scripts.test_asset_manager

      - name: Restore offline Piper model cache
        uses: actions/cache@v4
        with:
          path: models/piper
          key: piper-en-us-lessac-medium-v1

      - name: Install and smoke-test Piper offline TTS
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          mkdir -p models/piper
          if [ ! -s models/piper/en_US-lessac-medium.onnx ] || [ ! -s models/piper/en_US-lessac-medium.onnx.json ]; then
            python -m piper.download_voices en_US-lessac-medium --data-dir models/piper
          fi
          python -m piper -m "$GITHUB_WORKSPACE/models/piper/en_US-lessac-medium.onnx" -f /tmp/piper-ci-smoke.wav -- "Piper offline speech is ready."
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/piper-ci-smoke.wav)"
          awk -v d="$DURATION" 'BEGIN { exit !(d >= 0.5) }'
          echo "[piper-ci-smoke] Verified local speech duration: ${DURATION}s."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Fails CI on lint ERRORS only (warnings are non-blocking). Covers
        # src/ and remotion/. The _study/ reference clones are gitignored +
        # ignored here.
        run: npx eslint src/ remotion/

      - name: Run test suite
        # Network-dependent image-provider tests (Wikimedia/MetMuseum) skip
        # automatically when their host is unreachable (see TESTING.md §6), so
        # CI does not require external network access or API keys.
        # Output is teed to a file and uploaded as an artifact (below) so a
        # Linux-runner-only failure is diagnosable from the downloaded log when
        # the in-page step log is not retained.
        run: npm run test:unit 2>&1 | tee test-suite.log

      - name: Upload test log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-log
          path: test-suite.log
          if-no-files-found: ignore

      - name: Coverage
        # Produces a coverage report and fails CI if line coverage drops below floor.
        # Excludes render.e2e.test.ts (ffmpeg-dependent). Floor is 78% (~current level).
        env:
          MIN_LINE_COVERAGE: 77
        run: node --import tsx --experimental-test-coverage --test --experimental-test-module-mocks 'src/**/!(render.e2e).test.ts' remotion/**/*.test.ts | node scripts/check-coverage.mjs

      - name: MCP doc freshness
        # Fails CI if docs/MCP_TOOL_REFERENCE.md is out of date with the
        # register-*.ts source files. Catches forgotten regenerations.
        run: npm run verify:mcp-doc
