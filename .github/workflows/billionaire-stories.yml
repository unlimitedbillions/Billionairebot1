name: Billionaire Stories — One Person Per Run (Bezos 08:00, Musk 16:00 UTC)

on:
  schedule:
    - cron: "0 8,16 * * 1,3,6"
  workflow_dispatch:
    inputs:
      person:
        description: "Person to produce (scheduled runs choose automatically)"
        required: false
        type: choice
        options: [auto, musk, bezos]
        default: auto

permissions:
  contents: write

concurrency:
  group: billionaire-stories
  # Keep the current person's run alive if the next scheduled slot arrives.
  # The workflow itself restricts every run to exactly one person's short + long jobs.
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo "System ffmpeg: $(ffmpeg -version | head -n 1)"
          ffmpeg -hide_banner -filters 2>/dev/null | grep -F 'drawtext' >/dev/null

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Restore asset pool cache
        uses: actions/cache@v4
        with:
          path: |
            input/visuals
            cache
          key: assets-${{ hashFiles('input/scripts/billionaire-stories.json') }}
          restore-keys: assets-

      - name: Select production person
        id: person
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.person }}" != "" ] && [ "${{ inputs.person }}" != "auto" ]; then
            PERSON="${{ inputs.person }}"
          elif [ "${{ github.event.schedule }}" = "0 8,16 * * 1,3,6" ]; then
            # 08:00 UTC = Jeff Bezos; 16:00 UTC = Elon Musk.
            RUN_HOUR="$(date -u +%H)"
            if [ "$RUN_HOUR" = "08" ]; then
              PERSON="bezos"
            else
              PERSON="musk"
            fi
          else
            PERSON="musk"
          fi
          echo "person=$PERSON" >> "$GITHUB_OUTPUT"
          echo "Production person: $PERSON"

      - name: Select only this person's short + long jobs
        shell: bash
        env:
          PERSON: ${{ steps.person.outputs.person }}
        run: |
          python - <<'PY'
          import json, os
          person = os.environ["PERSON"]
          jobs = json.load(open("input/scripts/billionaire-stories.json", encoding="utf-8"))
          selected = [j for j in jobs if person in (" ".join([str(j.get("id","")), str(j.get("title","")), str(j.get("topic",""))]).lower())]
          if len(selected) != 2 or {j.get("platform") for j in selected} != {"shorts", "youtube"}:
              raise SystemExit(f"Expected exactly one short + one long job for {person}, found {len(selected)}")
          json.dump(selected, open("input/scripts/render-jobs.json", "w", encoding="utf-8"), indent=2)
          print("Selected jobs:", [j["id"] for j in selected])
          PY

      - name: PLAN + PREPARE (Prefetch + AI Fallback)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          PRODUCTION_PERSON: ${{ steps.person.outputs.person }}
        run: python scripts/asset_manager.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: PREFLIGHT gate
        env:
          CI_ZERO_NETWORK: "1"
        run: python scripts/preflight.py

      - name: Render shorts + longform (Local Assets + Prepared Audio)
        env:
          CI_ZERO_NETWORK: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENTIC_VOICE_FALLBACK: "1"
          AUTO_FREE_MUSIC: "true"
        run: npm run agentic:batch -- --file input/scripts/render-jobs.json

      - name: Duration gate
        run: node scripts/verify-durations.mjs --file input/scripts/render-jobs.json

      - name: Thumbnails + posters
        run: node scripts/make-thumbnails.mjs

      - name: Upload to YouTube as PRIVATE (Guarded)
        env:
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          YT_CLIENT_SECRETS_B64: ${{ secrets.YT_CLIENT_SECRETS_B64 }}
        run: |
          if [ -z "$YT_TOKEN_B64" ] || [ -z "$YT_CLIENT_SECRETS_B64" ]; then
            echo "[yt-guard] Secrets missing -> skipping upload."; exit 0
          fi
          if ! echo "$YT_TOKEN_B64" | base64 -d | python -m json.tool > /dev/null 2>&1; then
            echo "[yt-guard] YT_TOKEN_B64 invalid -> skipping upload."; exit 0
          fi
          python tools/youtube_oauth.py upload --file input/scripts/render-jobs.json

      - name: Publish TikTok (Guarded)
        env:
          UPLOAD_POST_ENABLED: "true"
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USERNAME: ${{ secrets.UPLOAD_POST_USERNAME }}
          UPLOAD_POST_PLATFORMS: tiktok
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: node scripts/publish-safe.mjs --file input/scripts/render-jobs.json

      - name: Commit histories
        if: always()
        run: |
          git config user.name "billionaire-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/published.json data/yt_uploads.json data/meta_uploads.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update logs [skip ci]"
            git push
          else
            echo "No history files changed; nothing to commit."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billionaire-pack-${{ github.run_number }}
          retention-days: 7
          path: |
            output/**/*.mp4
            output/**/thumb_*.jpg
            output/**/poster*.jpg
            cache/assets.json
