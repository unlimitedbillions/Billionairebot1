name: Preflight CI Validation

on:
  push:
    branches:
      - preflight/ci-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Python syntax validation
        run: python -m py_compile scripts/asset_manager.py scripts/preflight.py

      - name: Node syntax validation
        run: node --check scripts/verify-durations.mjs

      - name: Workflow/code contract checks
        run: |
          python - <<'PY'
          from pathlib import Path
          asset = Path('scripts/asset_manager.py').read_text()
          wf = Path('.github/workflows/billionaire-stories.yml').read_text()
          assert 'https://api.pexels.com/v1/videos/search' in asset
          assert 'CI_ZERO_NETWORK: "1"' in wf
          assert 'GEMINI_API_KEY' in wf
          assert 'VIDEO_PROVIDER_ORDER = ("pexels", "wikimedia", "archive")' in asset
          print('Workflow/code contracts: PASS')
          PY

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Mock provider-path validation
        env:
          PEXELS_API_KEY: validation-key
          GEMINI_API_KEY: validation-key
        run: |
          python - <<'PY'
          import base64
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('asset_manager', 'scripts/asset_manager.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          assert mod.VIDEO_PROVIDER_ORDER == ('pexels', 'wikimedia', 'archive')
          assert mod.PEXELS_KEY == 'validation-key'
          assert mod.GEMINI_KEY == 'validation-key'

          original_get = mod.get
          mod.get = lambda *args, **kwargs: {
              'videos': [{'video_files': [{'file_type': 'video/mp4', 'width': 1280, 'link': 'https://cdn.example.test/test.mp4'}]}]
          }
          assert mod.pexels_videos('technology', 'landscape') == ['https://cdn.example.test/test.mp4']
          mod.get = original_get

          png_b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          class FakeResponse:
              ok = True
              status_code = 200
              def json(self):
                  return {'candidates': [{'content': {'parts': [{'inlineData': {'data': png_b64}}]}}]}

          class FakeRequests:
              def post(self, url, **kwargs):
                  assert url.endswith('/v1/models/gemini-2.5-flash-image:generateContent')
                  assert kwargs['headers']['x-goog-api-key'] == 'validation-key'
                  body = kwargs['json']
                  assert body['generationConfig']['responseModalities'] == ['IMAGE']
                  assert body['generationConfig']['responseFormat']['image']['aspectRatio'] == '16:9'
                  return FakeResponse()

          old_requests = mod.requests
          mod.requests = FakeRequests()
          generated = mod.gemini_ai_image('semiconductor factory', 'landscape', 0)
          assert generated and (mod.VIS / generated).exists()
          assert mod._is_image(mod.VIS / generated)
          (mod.VIS / generated).unlink(missing_ok=True)
          mod.requests = old_requests
          print('Provider-path validation: PASS')
          PY
